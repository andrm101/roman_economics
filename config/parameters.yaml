# Parameter register (M0). One entry per parameter.
# status vocabulary:
#   measured_input        - read from a document (still subject to reading uncertainty)
#   external_estimate     - a modern scholar's reconstruction or calculation
#   calibrated            - fitted by this project (none yet)
#   exploratory           - unsupported choice; bounds are for sensitivity only
# evidence refers to anchor IDs (data/curated/anchors.csv), readings or interpretations.
version: 0.1.0
parameters:
  tau:
    symbol: "τ"
    definition: Alexandrian import duty (tetarte) as a share of assessed value
    unit: fraction
    baseline: 0.25
    bounds: [0.25, 0.25]
    scenarios: {double_tetarte: 0.4375}   # 1-(0.75*0.75): rival INT-TET-01 if both legs were levied on the same base
    status: measured_input
    evidence: [ANC-TETARTE-RATE, INT-TET-02, INT-TET-01]
  A_H:
    symbol: "A_H"
    definition: Gross assessed value of the Hermapollon cargo (whole cargo, before tetarte)
    unit: sestertius_notional
    baseline: 9215803        # RD-HERM-TOTAL-MORELLI (principal edition) under INT-HERM-01 (D008)
    bounds: [9215803, 9235803]
    alternatives:
      MORELLI_residual: 9215803
      HS1985_residual: 9235803        # superseded reading, kept for sensitivity
      HS1985_whole_base: 6926852      # rejected interpretation (INT-HERM-03), sensitivity only
      MORELLI_whole_base: 6911852     # rejected interpretation (INT-HERM-03), sensitivity only
    rejected_alternatives: [HS1985_whole_base, MORELLI_whole_base]
    status: measured_input
    evidence: [RD-HERM-TOTAL-MORELLI, RD-HERM-L27-THREE-PARTS, RD-HERM-COLI-QUARTERS, RD-HERM-TOTAL-HS1985, INT-HERM-01, INT-HERM-02, INT-HERM-03]
    note: "Derived by project code (romeco.m0.hermapollon); depends on a single document. Three-quarters scope now read directly in the text (v col. ii l. 27)."
  merchant_talent_litrai:
    definition: Roman pounds (litrai) per 'merchants' talent' used to re-express tetarte weights before pricing
    unit: litrai_per_talent
    baseline: 97.5
    bounds: [97.4967, 97.5100]
    status: measured_input
    evidence: [RD-HERM-COLI-QUARTERS]
    note: "Lost in the lacuna of v col. ii l. 9; identified from the document's own truncations at ll. 7/10 and 19/20 (romeco.m0.pvindob_arithmetic.merchant_talent_interval)."
  pepper_price_dr_per_mina:
    definition: Valuation price of pepper in the verso
    unit: drachma_EG_per_mina
    baseline: null
    bounds: [6, 24]
    alternatives: {DeRomanis_6: 6, Morelli_24: 24}
    status: external_estimate
    evidence: [RD-HERM-PEPPER-PART, INT-HERM-04, INT-HERM-05]
    note: "Value preserved, price/weight disputed. Changes cargo MASS by a factor of 4, not cargo value."
  tax_mode:
    definition: How the tetarte was collected
    unit: categorical
    baseline: in_kind
    status: measured_input
    evidence: [RD-HERM-COLI-QUARTERS, INT-TET-03]
    note: "Quarter shares (and a surplus) listed as quantities removed; De Romanis 2014 keeps 'entirely in money' open."
  N:
    symbol: "N"
    definition: India-bound sailings from Egyptian Red Sea ports per year
    unit: ships_per_year
    baseline: null
    bounds: [10, 120]
    status: exploratory
    evidence: [ANC-STRABO-SHIPS]
    note: "Strabo's 120 is Augustan, one port, ambiguous (annual vs at-visit), and need not all be India-bound. Lower bound is an exploratory floor."
  lam:
    symbol: "λ"
    definition: Mean gross assessed value per sailing relative to the Hermapollon
    unit: ratio
    baseline: null
    bounds: [0.1, 1.5]
    status: exploratory
    evidence: []
    note: "No evidence on the size distribution of cargoes; the Hermapollon may be atypically large. Key unidentified parameter."
  kappa:
    symbol: "κ"
    definition: Share of tetarte liability actually collected
    unit: fraction
    baseline: null
    bounds: [0.7, 1.0]
    status: exploratory
    evidence: []
  O:
    symbol: "O"
    definition: Annual outflow to India in nominal HS
    unit: sestertius_notional
    baseline: 50000000
    bounds: [50000000, 100000000]
    status: measured_input
    evidence: [ANC-PLINY-OUTFLOW-INDIA, ANC-PLINY-OUTFLOW-EAST]
    note: "Literary, moralising; object (bullion vs purchase cost) unclear. Upper value covers India+Seres+Arabia."
  c:
    symbol: "c"
    definition: Non-purchase venture costs (ship, transport, fees, interest) as share of Indian purchase cost
    unit: ratio
    baseline: 0.5
    bounds: [0.2, 1.5]
    status: exploratory
    evidence: []
    note: "To be replaced by an itemised cost build-up (camel, Nile, ship) once Adams 2007 and the O.Berenike/Nikanor material are inspected."
  p:
    symbol: "p"
    definition: Probability of losing ship and cargo on one round trip
    unit: probability
    baseline: 0.05
    bounds: [0.01, 0.15]
    status: exploratory
    evidence: []
  camel_capacity_kg:
    definition: Payload of one camel load on the Coptos-Berenike route
    unit: kg
    baseline: 200
    bounds: [150, 250]
    status: exploratory
    evidence: []
    note: "Placeholder; candidate source Adams 2007 (cited_only)."
  route_nile_km:
    definition: Juliopolis-Coptos river distance
    unit: km
    baseline: 457.32        # 309 mp x 1.48 (CR-LEN-ROM-001)
    status: measured_input
    evidence: [ANC-PLINY-NILE]
  route_desert_km:
    definition: Coptos-Berenike road distance
    unit: km
    baseline: 380.36        # 257 mp x 1.48
    status: measured_input
    evidence: [ANC-PLINY-DESERT, MIL-ED-COPTOS-BERENIKE-KM, CTX-ORBIS-COPTOS-BERENIKE]
    note: "Three sources agree (~380 km) but share lineage: ORBIS geometry and Nappo's figure are not independent of Pliny/surveys."
  # ---- context layer (legions, cities, roads, prices) — session 3 ----
  egypt_wheat_price_pre_break:
    definition: Farm-gate wheat price band in middle Egypt, AD 80s-160s
    unit: drachma_EG_per_artaba
    baseline: 9
    bounds: [6, 12]
    status: external_estimate
    evidence: [PL-EG-WHEAT-W1]
    note: "Price regime covering W1 (from the 70s) and the Hermapollon (126-175): nominal values comparable without deflation inside this band."
  egypt_price_break_ratio:
    definition: Ratio of price levels after vs before the late-2nd-century break (160s-190s)
    unit: ratio
    baseline: 2
    bounds: [1.33, 2.0]
    status: external_estimate
    evidence: [PL-EG-DOUBLING, PL-EG-WHEAT-W3]
    note: "Median 16/9 = 1.78; 'doubling' per Rathbone. Mechanism (Antonine plague) disputed."
  p_hermapollon_post_break:
    definition: Probability the Hermapollon valuation post-dates the price break
    unit: probability
    baseline: 0.06
    bounds: [0.0, 0.3]
    status: exploratory
    evidence: [CTX-HERMAPOLLON-POSTBREAK-P]
    note: "Uniform-date assumption on HGV 126-175 and a break in 160-199; upper bound allows for a mid-160s break."
  legionary_pay_HS:
    definition: Gross annual pay of a legionary/auxiliary infantryman, AD 85 - Septimius Severus
    unit: sestertius_per_year
    baseline: 1200
    bounds: [1200, 1200]
    status: external_estimate
    evidence: [PL-ARMY-PAY-85-193]
    note: "Use as a scale: HS 1.2 m per 1,000 soldier-years. Garrison size of Egypt NOT yet sourced."
  praesidium_garrison:
    definition: Soldiers per Eastern Desert praesidium
    unit: soldiers
    baseline: 23
    bounds: [22, 24]
    status: external_estimate
    evidence: [MIL-PRAESIDIA-SIZE]
  ed_military_installations_W2:
    definition: Military installations (fort/station) active in the Eastern Desert, 100-200 CE
    unit: places
    baseline: null
    bounds: [58, 94]
    status: external_estimate
    evidence: [CTX-PLEIADES-ED-MIL-W2]
    note: "Pleiades editorial dating; upper bound adds undated places. Not all were simultaneously garrisoned."
  annual_inflation_1_2c:
    definition: Average annual price inflation in the first two centuries CE (upper bound)
    unit: fraction_per_year
    baseline: null
    bounds: [0.0, 0.01]
    status: external_estimate
    evidence: [PL-ROM-INFL-1-2C]
