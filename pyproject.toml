[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "romeco"
version = "0.1.0"
description = "Roman Economic Systems Lab: evidence registers, provenance-aware schema, and M0 feasibility model for the Roman Egypt–Red Sea–India pilot"
requires-python = ">=3.11"
# Pinned to the versions the test suite was run against (2026-10-24).
dependencies = [
    "duckdb==2.0.0",
    "pyyaml==6.0.3",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "openpyxl==3.1.5",
    "networkx==3.5",
    "lxml==6.1.3",
    "rapidfuzz==3.14.1",
    "rdflib==7.1.4",
    "pyshacl==0.30.1",
]
# External CLI tools used by romeco.corpus (versions recorded in each parse manifest):
#   poppler-utils pdftotext/pdftoppm 24.02.0; tesseract 5.3.4 with tessdata_fast @87416418

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
romeco = "romeco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning:pyparsing.*", "ignore::DeprecationWarning:rdflib.*"]
